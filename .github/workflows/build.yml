name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a release from the project version'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure public update repository
        shell: pwsh
        run: |
          @{Repository=$env:GITHUB_REPOSITORY} | ConvertTo-Json | Set-Content src/SupportDesk.Desktop/release.json -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version=([xml](Get-Content src/SupportDesk.Desktop/SupportDesk.Desktop.csproj -Raw)).Project.PropertyGroup.Version
            if ($env:GITHUB_REF_NAME -ne "v$version") {throw 'Tag must match the project version'}
          }
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: support-desk-windows
          path: |
            artifacts/support-desk-windows-*.zip
            artifacts/SHA256SUMS.txt
            artifacts/release-version.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: support-desk-windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version=$(cat release/release-version.txt | tr -d '\r\n')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "v$version" release/*.zip release/SHA256SUMS.txt --target "$RELEASE_COMMIT" --generate-notes
