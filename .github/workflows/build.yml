name: Build and release
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure public update repository
        shell: pwsh
        run: |
          @{Repository=$env:GITHUB_REPOSITORY} | ConvertTo-Json | Set-Content src/SupportDesk.Desktop/release.json -Encoding utf8
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: support-desk-windows
          path: |
            artifacts/support-desk-windows-*.zip
            artifacts/SHA256SUMS.txt
            artifacts/release-version.txt
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: support-desk-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: support-desk-windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          version=$(cat release/release-version.txt | tr -d '\r\n')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          latest_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" != "$RELEASE_COMMIT" ]; then
            echo "A newer commit is on main; skipping this release."
            exit 0
          fi
          if gh release view "v$version" --json tagName >/dev/null 2>&1; then
            echo "Release v$version already exists; skipping."
            exit 0
          fi
          gh release create "v$version" release/*.zip release/SHA256SUMS.txt --target "$RELEASE_COMMIT" --generate-notes
